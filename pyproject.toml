[project]
name = "st-score-restore-engine"
version = "0.4.0"
description = "Safety-first restoration and validation engine for music-score and guitar-TAB documents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5",
  "opencv-python-headless==4.13.0.92",
]

[tool.st_score_restore]
schema_version = 1
primary_python = "3.12"
production_restoration_enabled = false
opencv_candidate_enabled = true
music_safety_validator_enabled = true
job_api_enabled = true
in_memory_store_only = false
durable_local_store_enabled = true
multi_worker_fencing_enabled = true
production_deployment_enabled = false
