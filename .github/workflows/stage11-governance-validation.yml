name: Stage 11 governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage11-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate dependency lock
        run: python tools/validate_dependency_lock.py

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Validate Stage 10 final-exit current truth
        run: python tools/validate_stage10_final_exit_current_truth.py

      - name: Validate Stage 11 entry authorization
        run: python tools/validate_stage11_entry_authorization.py

      - name: Run Stage 11 synthetic image-model drills
        run: python tools/run_stage11_image_model_drills.py

      - name: Run Stage 11 foundation tests
        run: python -m unittest tests.test_stage11_foundation -v

      - name: Validate Stage 11 training authorization
        run: python tools/validate_stage11_training_authorization.py

      - name: Run Stage 11 training kickoff drills
        run: python tools/run_stage11_training_kickoff_drills.py

      - name: Run Stage 11 training kickoff tests
        run: python -m unittest tests.test_stage11_training_kickoff -v

      - name: Validate Stage 11 training kickoff current truth
        run: python tools/validate_stage11_training_kickoff_current_truth.py

      - name: Run CameraPrIMuS dataset tests
        run: python -m unittest tests.test_stage11_cameraprimus -v

      - name: Validate CameraPrIMuS rights review
        run: python tools/validate_stage11_cameraprimus_rights_review.py

      - name: Run CameraPrIMuS rights review tests
        run: python -m unittest tests.test_stage11_cameraprimus_rights_review -v

      - name: Validate DeepScoresV2 Dense registration
        run: python tools/validate_stage11_deepscores_dense_registration.py

      - name: Run DeepScoresV2 Dense admission tests
        run: python -m unittest tests.test_stage11_deepscores_dense -v

      - name: Validate DeepScoresV2 Colab notebook JSON
        run: python -m json.tool notebooks/stage11_deepscoresv2_dense_residual_unet_colab.ipynb > /dev/null

      - name: Validate DeepScoresV2 Colab notebook safety and syntax
        run: python tools/validate_stage11_deepscores_colab_notebook.py

      - name: Validate first DeepScoresV2 GPU run evidence
        run: python tools/validate_stage11_first_gpu_run_evidence.py

      - name: Run first GPU run evidence tests
        run: python -m unittest tests.test_stage11_first_gpu_run_evidence -v

      - name: Validate held-out evaluation notebook JSON
        run: python -m json.tool notebooks/stage11_deepscoresv2_dense_heldout_eval_colab.ipynb > /dev/null

      - name: Validate held-out evaluation notebook safety and syntax
        run: python tools/validate_stage11_deepscores_heldout_notebook.py

      - name: Validate held-out final evidence
        run: python tools/validate_stage11_heldout_evidence.py

      - name: Run held-out final evidence tests
        run: python -m unittest tests.test_stage11_heldout_evidence -v

      - name: Validate Stage 9A symbol-region notebook JSON
        run: python -m json.tool notebooks/stage11_deepscoresv2_dense_stage9a_symbol_region_eval_colab.ipynb > /dev/null

      - name: Validate Stage 9A symbol-region notebook safety and syntax
        run: python tools/validate_stage11_stage9a_symbol_region_notebook.py

      - name: Validate Stage 11 Colab pipeline current truth
        run: python tools/validate_stage11_colab_pipeline_current_truth.py

      - name: Validate Stage 11 V2 notebook JSON
        run: |
          python -m json.tool notebooks/stage11_deepscoresv2_dense_residual_unet_v2_symbol_preservation_colab.ipynb > /dev/null
          python -m json.tool notebooks/stage11_deepscoresv2_dense_v2_dev_eval_colab.ipynb > /dev/null
          python -m json.tool notebooks/stage11_deepscoresv2_dense_v2_heldout_eval_colab.ipynb > /dev/null
          python -m json.tool notebooks/stage11_deepscoresv2_dense_v2_stage9a_symbol_region_eval_colab.ipynb > /dev/null

      - name: Validate Stage 11 V2 notebook and runtime governance
        run: python tools/validate_stage11_v2_notebooks.py

      - name: Run Stage 11 V2 symbol-preservation tests
        run: python -m unittest tests.test_stage11_v2_symbol_preservation -v

      - name: Validate Stage 11 V2 current truth
        run: python tools/validate_stage11_v2_current_truth.py

      - name: Run Stage 11 V2 current-truth tests
        run: python -m unittest tests.test_stage11_v2_current_truth -v

      - name: Validate legacy CameraPrIMuS notebook JSON
        run: python -m json.tool notebooks/stage11_cameraprimus_residual_unet_colab.ipynb > /dev/null

      - name: Run Stage 10 selector regression tests
        run: python -m unittest tests.test_st_restore_selector -v

      - name: Run Stage 9A preservation regression tests
        run: python -m unittest tests.test_music_symbol_preservation -v

      - name: Run Stage 9 comparator regression tests
        run: python -m unittest tests.test_multi_engine_comparator -v

      - name: Run architecture regression tests
        run: python -m unittest tests.test_restoration_pipeline_architecture -v

      - name: Validate Stage 11 foundation current truth
        run: python tools/validate_stage11_foundation_current_truth.py

      - name: Compile Stage 11 sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_entry_authorization.py \
            src/st_score_restore/stage11_foundation_current_truth.py \
            src/st_score_restore/st_restore_image_model.py \
            src/st_score_restore/stage11_training_authorization.py \
            src/st_score_restore/stage11_training_dataset.py \
            src/st_score_restore/stage11_training_kickoff_current_truth.py \
            src/st_score_restore/stage11_cameraprimus.py \
            src/st_score_restore/stage11_cameraprimus_rights_review.py \
            src/st_score_restore/stage11_deepscores_dense.py \
            src/st_score_restore/stage11_first_gpu_run_evidence.py \
            src/st_score_restore/stage11_heldout_evidence.py \
            src/st_score_restore/stage11_colab_pipeline_current_truth.py \
            src/st_score_restore/stage11_v2_symbol_preservation.py \
            src/st_score_restore/stage11_v2_current_truth.py \
            tools/validate_stage11_entry_authorization.py \
            tools/run_stage11_image_model_drills.py \
            tools/validate_stage11_foundation_current_truth.py \
            tools/validate_stage11_training_authorization.py \
            tools/run_stage11_training_kickoff_drills.py \
            tools/validate_stage11_training_kickoff_current_truth.py \
            tools/build_stage11_cameraprimus_manifest.py \
            tools/validate_stage11_cameraprimus_rights_review.py \
            tools/validate_stage11_deepscores_dense_registration.py \
            tools/validate_stage11_deepscores_colab_notebook.py \
            tools/validate_stage11_first_gpu_run_evidence.py \
            tools/validate_stage11_deepscores_heldout_notebook.py \
            tools/validate_stage11_heldout_evidence.py \
            tools/validate_stage11_stage9a_symbol_region_notebook.py \
            tools/validate_stage11_colab_pipeline_current_truth.py \
            tools/stage11_v2_colab_runtime.py \
            tools/validate_stage11_v2_notebooks.py \
            tools/validate_stage11_v2_current_truth.py
