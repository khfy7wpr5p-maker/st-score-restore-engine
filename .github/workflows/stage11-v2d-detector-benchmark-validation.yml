name: Stage 11 V2d Detector Benchmark Validation

on:
  pull_request:
    paths:
      - "src/st_score_restore/stage11_v2d_detector_benchmark.py"
      - "src/st_score_restore/stage11_v2d_colab_runner.py"
      - "src/st_score_restore/stage11_v2d_colab_resume.py"
      - "tests/test_stage11_v2d_detector_benchmark.py"
      - "evidence/stage11/v2d/**"
      - "notebooks/stage11_v2d_colab_gpu_detector_benchmark.ipynb"
      - "docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json"
      - ".github/workflows/stage11-v2d-detector-benchmark-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/st_score_restore/stage11_v2d_detector_benchmark.py"
      - "src/st_score_restore/stage11_v2d_colab_runner.py"
      - "src/st_score_restore/stage11_v2d_colab_resume.py"
      - "tests/test_stage11_v2d_detector_benchmark.py"
      - "evidence/stage11/v2d/**"
      - "notebooks/stage11_v2d_colab_gpu_detector_benchmark.ipynb"
      - "docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json"
      - ".github/workflows/stage11-v2d-detector-benchmark-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Validate V2d benchmark contract
        run: python -m unittest tests.test_stage11_v2d_detector_benchmark -v
      - name: Compile V2d modules and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2d_detector_benchmark.py \
            src/st_score_restore/stage11_v2d_colab_runner.py \
            src/st_score_restore/stage11_v2d_colab_resume.py \
            tests/test_stage11_v2d_detector_benchmark.py
      - name: Validate V2d JSON and notebook syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('evidence/stage11/v2d/v2d-detector-candidate-registry.v1.json'),
              Path('notebooks/stage11_v2d_colab_gpu_detector_benchmark.ipynb'),
              Path('docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid json: {path}')
          PY
