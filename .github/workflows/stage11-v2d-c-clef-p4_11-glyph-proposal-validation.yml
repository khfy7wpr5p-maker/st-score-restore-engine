name: Stage 11 V2d C-clef P4.11 Glyph Proposal Validation

on:
  pull_request:
    paths:
      - 'src/st_score_restore/stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py'
      - 'tests/test_stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py'
      - 'evidence/stage11/v2d/v2d-c-clef-p4_11-source-glyph-proposal-plan.v1.json'
      - '.github/workflows/stage11-v2d-c-clef-p4_11-glyph-proposal-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'src/st_score_restore/stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py'
      - 'tests/test_stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py'
      - 'evidence/stage11/v2d/v2d-c-clef-p4_11-source-glyph-proposal-plan.v1.json'
      - '.github/workflows/stage11-v2d-c-clef-p4_11-glyph-proposal-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Run P4.11 focused tests
        run: python -m pytest tests/test_stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py -q
      - name: Compile runner and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py \
            tests/test_stage11_v2d_c_clef_p4_11_glyph_proposal_generator.py
      - name: Validate development plan JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('evidence/stage11/v2d/v2d-c-clef-p4_11-source-glyph-proposal-plan.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['developmentOnly'] is True
          assert payload['qualificationEvidence'] is False
          assert payload['safety']['newIndependentHoldoutAccess'] is False
          assert payload['safety']['detectorQualified'] is False
          print('valid:', path)
          PY
