name: Stage 6 governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage6-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Stage 6 entry governance authorization
        run: python tools/validate_stage6_entry_authorization.py

      - name: Validate Stage 6 post-entry current truth
        run: python tools/validate_stage6_post_entry_authorization_current_truth.py

      - name: Validate Stage 6 S6-02 trust-boundary decision
        run: python tools/validate_stage6_trust_boundary_decision.py

      - name: Validate Stage 6 S6-02 current truth
        run: python tools/validate_stage6_s6_02_current_truth.py

      - name: Run Stage 6 governance unit tests
        run: |
          python -m unittest \
            tests.test_stage6_entry_authorization \
            tests.test_stage6_entry_current_truth \
            tests.test_stage6_trust_boundary_decision \
            tests.test_stage6_s6_02_current_truth -v

      - name: Compile Stage 6 governance sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage6_entry_authorization.py \
            src/st_score_restore/stage6_entry_current_truth.py \
            src/st_score_restore/stage6_trust_boundary_decision.py \
            src/st_score_restore/stage6_s6_02_current_truth.py \
            tools/validate_stage6_entry_authorization.py \
            tools/validate_stage6_post_entry_authorization_current_truth.py \
            tools/validate_stage6_trust_boundary_decision.py \
            tools/validate_stage6_s6_02_current_truth.py
