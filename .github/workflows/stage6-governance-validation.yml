name: Stage 6 governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage6-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Stage 6 entry governance authorization
        run: python tools/validate_stage6_entry_authorization.py

      - name: Validate Stage 6 post-entry current truth
        run: python tools/validate_stage6_post_entry_authorization_current_truth.py

      - name: Validate Stage 6 S6-02 trust-boundary decision
        run: python tools/validate_stage6_trust_boundary_decision.py

      - name: Validate Stage 6 S6-02 current truth
        run: python tools/validate_stage6_s6_02_current_truth.py

      - name: Validate Stage 6 S6-03 identity/authz authorization
        run: python tools/validate_stage6_s6_03_authorization.py

      - name: Validate Stage 6 S6-03 current truth
        run: python tools/validate_stage6_s6_03_current_truth.py

      - name: Validate Stage 6 S6-04 secrets/KMS/IAM authorization
        run: python tools/validate_stage6_s6_04_authorization.py

      - name: Validate Stage 6 S6-04 current truth
        run: python tools/validate_stage6_s6_04_current_truth.py

      - name: Validate Stage 6 S6-05 production-network authorization
        run: python tools/validate_stage6_s6_05_authorization.py

      - name: Validate Stage 6 S6-05 current truth
        run: python tools/validate_stage6_s6_05_current_truth.py

      - name: Validate Stage 6 S6-06 storage/deployment authorization
        run: python tools/validate_stage6_s6_06_authorization.py

      - name: Validate Stage 6 S6-06 current truth
        run: python tools/validate_stage6_s6_06_current_truth.py

      - name: Validate Stage 6 S6-07 synthetic operational-drills authorization
        run: python tools/validate_stage6_s6_07_authorization.py

      - name: Run Stage 6 S6-07 synthetic operational safety/recovery drills
        run: python tools/run_stage6_s6_07_synthetic_operational_drills.py

      - name: Run Stage 6 governance and production security unit tests
        run: |
          python -m unittest \
            tests.test_stage6_entry_authorization \
            tests.test_stage6_entry_current_truth \
            tests.test_stage6_trust_boundary_decision \
            tests.test_stage6_s6_02_current_truth \
            tests.test_stage6_s6_03_authorization \
            tests.test_stage6_s6_03_current_truth \
            tests.test_stage6_production_identity \
            tests.test_stage6_s6_04_authorization \
            tests.test_stage6_s6_04_current_truth \
            tests.test_stage6_production_secrets_kms_iam \
            tests.test_stage6_s6_05_authorization \
            tests.test_stage6_production_network \
            tests.test_stage6_s6_05_current_truth \
            tests.test_stage6_s6_06_authorization \
            tests.test_stage6_production_storage_deployment \
            tests.test_stage6_s6_06_current_truth \
            tests.test_stage6_s6_07_authorization \
            tests.test_stage6_operational_drills -v

      - name: Compile Stage 6 governance and production security sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage6_entry_authorization.py \
            src/st_score_restore/stage6_entry_current_truth.py \
            src/st_score_restore/stage6_trust_boundary_decision.py \
            src/st_score_restore/stage6_s6_02_current_truth.py \
            src/st_score_restore/stage6_s6_03_authorization.py \
            src/st_score_restore/stage6_s6_03_current_truth.py \
            src/st_score_restore/stage6_s6_04_authorization.py \
            src/st_score_restore/stage6_s6_04_current_truth.py \
            src/st_score_restore/stage6_s6_05_authorization.py \
            src/st_score_restore/stage6_s6_05_current_truth.py \
            src/st_score_restore/stage6_s6_06_authorization.py \
            src/st_score_restore/stage6_s6_06_current_truth.py \
            src/st_score_restore/stage6_s6_07_authorization.py \
            src/st_score_restore/stage6_operational_drills.py \
            src/st_score_restore/production_identity.py \
            src/st_score_restore/production_http_auth.py \
            src/st_score_restore/production_secrets_kms_iam.py \
            src/st_score_restore/production_network.py \
            src/st_score_restore/production_storage_deployment.py \
            tools/validate_stage6_entry_authorization.py \
            tools/validate_stage6_post_entry_authorization_current_truth.py \
            tools/validate_stage6_trust_boundary_decision.py \
            tools/validate_stage6_s6_02_current_truth.py \
            tools/validate_stage6_s6_03_authorization.py \
            tools/validate_stage6_s6_04_authorization.py \
            tools/validate_stage6_s6_04_current_truth.py \
            tools/validate_stage6_s6_05_authorization.py \
            tools/validate_stage6_s6_05_current_truth.py \
            tools/validate_stage6_s6_06_authorization.py \
            tools/validate_stage6_s6_06_current_truth.py \
            tools/validate_stage6_s6_07_authorization.py \
            tools/run_stage6_s6_07_synthetic_operational_drills.py
