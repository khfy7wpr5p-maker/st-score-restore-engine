name: Stage 9A governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage9a-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate dependency lock
        run: python tools/validate_dependency_lock.py

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Validate Stage 9 final-exit current truth
        run: python tools/validate_stage9_final_exit_current_truth.py

      - name: Validate Stage 9A entry authorization
        run: python tools/validate_stage9a_entry_authorization.py

      - name: Run Stage 9A synthetic preservation drills
        run: python tools/run_stage9a_mspm_drills.py

      - name: Run Stage 9A unit tests
        run: |
          python -m unittest \
            tests.test_stage9a_entry_authorization \
            tests.test_music_symbol_preservation -v

      - name: Run Stage 9 comparator regression tests
        run: python -m unittest tests.test_multi_engine_comparator -v

      - name: Run architecture regression tests
        run: python -m unittest tests.test_restoration_pipeline_architecture -v

      - name: Validate Stage 9A final exit
        run: python tools/validate_stage9a_final_exit.py

      - name: Validate Stage 9A final-exit current truth
        run: python tools/validate_stage9a_final_exit_current_truth.py

      - name: Run Stage 9A final-exit tests
        run: python -m unittest tests.test_stage9a_final_exit -v

      - name: Compile Stage 9A sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage9a_entry_authorization.py \
            src/st_score_restore/music_symbol_preservation.py \
            src/st_score_restore/stage9a_final_exit.py \
            src/st_score_restore/stage9a_final_exit_current_truth.py \
            tools/validate_stage9a_entry_authorization.py \
            tools/run_stage9a_mspm_drills.py \
            tools/validate_stage9a_final_exit.py \
            tools/validate_stage9a_final_exit_current_truth.py
