name: Stage 11 V2d Staff-Line Multi-System Source Detector Validation

on:
  pull_request:
    paths:
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector.py'
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_1.py'
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_2.py'
      - 'src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_template.py'
      - 'src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_secondary.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_1.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_2.py'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-baseline-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/stage11_v2d_staff_line_multisystem_source_v1_1_evaluation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_1-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-teacher-truth-hash-reconciliation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json'
      - 'evidence/stage11/v2d/stage11_v2d_staff_line_multisystem_source_v1_2_evaluation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_2-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-v1_1-source-identity-reconciliation.v1.json'
      - '.github/workflows/stage11-v2d-staff-line-multisystem-source-detector-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector.py'
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_1.py'
      - 'src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_2.py'
      - 'src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_template.py'
      - 'src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_secondary.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_1.py'
      - 'tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_2.py'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-baseline-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/stage11_v2d_staff_line_multisystem_source_v1_1_evaluation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_1-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-teacher-truth-hash-reconciliation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json'
      - 'evidence/stage11/v2d/stage11_v2d_staff_line_multisystem_source_v1_2_evaluation.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_2-development-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-v1_1-source-identity-reconciliation.v1.json'
      - '.github/workflows/stage11-v2d-staff-line-multisystem-source-detector-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Run multi-system source-detector tests
        run: |
          python -m unittest tests.test_stage11_v2d_staff_line_multisystem_source_detector -v
          python -m unittest tests.test_stage11_v2d_staff_line_multisystem_source_detector_v1_1 -v
          python -m unittest tests.test_stage11_v2d_staff_line_multisystem_source_detector_v1_2 -v
      - name: Compile source detectors and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector.py \
            src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_1.py \
            src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector_v1_2.py \
            src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_template.py \
            src/st_score_restore/_stage11_v2d_staff_line_multisystem_source_detector_v1_2_secondary.py \
            tests/test_stage11_v2d_staff_line_multisystem_source_detector.py \
            tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_1.py \
            tests/test_stage11_v2d_staff_line_multisystem_source_detector_v1_2.py
      - name: Validate v1 development-only plan and source-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan_path = Path('evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          assert plan['developmentOnly'] is True
          assert plan['qualificationEvidence'] is False
          assert plan['inputs']['newIndependentHoldoutAccessAuthorized'] is False
          assert plan['inputs']['restoredOutputsAuthorizedForDetectorDevelopment'] is False
          assert plan['detectorContract']['sourceOnly'] is True
          assert plan['detectorContract']['deterministic'] is True
          assert plan['detectorContract']['trainingOrFineTuning'] is False
          assert plan['detectorContract']['teacherCoordinatesUsedDuringInference'] is False
          assert plan['detectorContract']['pageIdSpecificRulesForbidden'] is True
          assert plan['detectorContract']['mustProcessWholePage'] is True
          assert plan['detectorContract']['mustReturnAllSupportedSystemsInsteadOfFirstMatch'] is True
          for key in ('detectorQualified','semanticPreservationEstablished','overallStage11PassAuthorized','productionReady','stage12EntryAuthorized'):
              assert plan['claimBoundary'][key] is False
          source = Path('src/st_score_restore/stage11_v2d_staff_line_multisystem_source_detector.py').read_text(encoding='utf-8')
          assert 'def detect_staff_systems(' in source
          assert 'def freeze_source_folder(' in source
          assert 'page_id' not in source[source.index('def detect_staff_systems('):source.index('def sha256_file(')]
          assert 'restored_outputs' not in source.lower()
          PY
      - name: Validate frozen v1 development result binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1-development-result-binding.v1.json').read_text(encoding='utf-8'))
          assert result['developmentOnly'] is True
          assert result['qualificationEvidence'] is False
          assert result['phaseAFreeze']['pageCount'] == 20
          assert result['phaseAFreeze']['sourceIdentityMatchedPages'] == 20
          assert result['phaseAFreeze']['predictedSystemCount'] == 89
          assert result['developmentMetrics']['diagnosticMatchedSystemCountAtHalfSpacing'] == 71
          assert result['developmentMetrics']['fiveLineCountCorrectRate'] == 1.0
          assert result['developmentMetrics']['lineOrderCorrectRate'] == 1.0
          assert result['decision']['sourceDetectorAdequacyEstablished'] is False
          assert result['decision']['restoredImageTopologyComparisonAuthorized'] is False
          recon = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-teacher-truth-hash-reconciliation.v1.json').read_text(encoding='utf-8'))
          assert recon['teacherArtifact']['sourceShaMatchedPages'] == 20
          assert recon['teacherArtifact']['reconstructedTeacherMaskShaMatchedPages'] == 20
          PY
      - name: Validate frozen v1.1 development result binding
        run: |
          python - <<'PY'
          import inspect
          import json
          from pathlib import Path
          from st_score_restore import stage11_v2d_staff_line_multisystem_source_detector_v1_1 as detector
          plan = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-multisystem-source-detector-development-plan.v1.1.json').read_text(encoding='utf-8'))
          assert plan['developmentOnly'] is True
          assert plan['qualificationEvidence'] is False
          result = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_1-development-result-binding.v1.json').read_text(encoding='utf-8'))
          assert result['developmentOnly'] is True
          assert result['qualificationEvidence'] is False
          assert result['phaseAFreeze']['pageCount'] == 20
          assert result['phaseAFreeze']['sourceIdentityMatchedPages'] == 20
          assert result['phaseAFreeze']['predictedSystemCount'] == 114
          assert result['phaseAFreeze']['byteRepeatDeterminismVerified'] is True
          assert result['developmentMetrics']['diagnosticMatchedSystemCountAtHalfSpacing'] == 91
          assert abs(result['developmentMetrics']['diagnosticTeacherSystemRecallAtHalfSpacing'] - 0.4619289340101523) < 1e-12
          assert abs(result['developmentMetrics']['diagnosticPredictedSystemPrecisionAtHalfSpacing'] - 0.7982456140350878) < 1e-12
          assert result['developmentMetrics']['fiveLineCountCorrectRate'] == 1.0
          assert result['developmentMetrics']['lineOrderCorrectRate'] == 1.0
          assert result['decision']['sourceDetectorAdequacyEstablished'] is False
          sig = inspect.signature(detector.detect_staff_systems)
          assert list(sig.parameters) == ['image', 'config']
          assert sig.parameters['config'].kind is inspect.Parameter.KEYWORD_ONLY
          PY
      - name: Validate frozen pre-holdout policy and v1.2 development result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json').read_text(encoding='utf-8'))
          assert policy['status'] == 'FROZEN_PRE_HOLDOUT'
          assert policy['freezeBoundary']['freshIndependentHoldoutAccessed'] is False
          assert policy['freezeBoundary']['restoredOutputsAccessedForStaffTopology'] is False
          assert policy['developmentReadinessForFutureHoldoutRequest']['qualificationClaim'] is False
          assert policy['developmentReadinessForFutureHoldoutRequest']['freshHoldoutAutomaticallyAuthorized'] is False
          assert policy['matchingRule']['compatibilityRequirement'].startswith('The scoring implementation used for qualification must reproduce')
          for value in policy['claimBoundary'].values():
              assert value is False

          evaluation = json.loads(Path('evidence/stage11/v2d/stage11_v2d_staff_line_multisystem_source_v1_2_evaluation.v1.json').read_text(encoding='utf-8'))
          assert evaluation['developmentOnly'] is True
          assert evaluation['qualificationEvidence'] is False
          assert evaluation['scorerCompatibility']['passed'] is True
          assert evaluation['scorerCompatibility']['reproducedMatchedSystemCountAtHalfSpacing'] == 71
          assert evaluation['frozenRawArtifact']['pageCount'] == 20
          assert evaluation['frozenRawArtifact']['predictedSystemCount'] == 187
          assert evaluation['frozenRawArtifact']['sourceIdentityMatchedCount'] == 20
          assert evaluation['frozenRawArtifact']['byteRepeatDeterminismVerified'] is True
          assert evaluation['scoring']['matchedSystemCount'] == 141
          assert abs(evaluation['scoring']['teacherSystemRecallAtHalfSpacing'] - 0.7157360406091371) < 1e-12
          assert abs(evaluation['scoring']['predictedSystemPrecisionAtHalfSpacing'] - 0.7540106951871658) < 1e-12
          assert evaluation['scoring']['presentPageCoverage']['rate'] == 1.0
          assert evaluation['scoring']['absentPageSpecificity']['rate'] == 1.0
          assert evaluation['scoring']['fiveLineCountCorrectRate'] == 1.0
          assert evaluation['scoring']['lineOrderCorrectRate'] == 1.0

          binding = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-multisystem-source-v1_2-development-result-binding.v1.json').read_text(encoding='utf-8'))
          assert binding['developmentOnly'] is True
          assert binding['qualificationEvidence'] is False
          assert binding['phaseAFreeze']['rawArtifactSha256'] == 'b89241345e9ae6d58dd010c111e76bd724f68272fb5b18d6bb3fbf6b02a4ac76'
          assert binding['phaseAFreeze']['byteRepeatDeterminismVerified'] is True
          assert binding['decision']['developmentReadinessForFutureHoldoutRequest'] is True
          assert binding['decision']['sourceDetectorAdequacyEstablished'] is False
          assert binding['decision']['detectorQualified'] is False
          assert binding['decision']['freshIndependentHoldoutAuthorized'] is False
          assert binding['decision']['restoredImageTopologyComparisonAuthorized'] is False
          assert binding['developmentMetrics']['syntheticSixLineTabNegativeControl']['rejectionRate'] == 1.0
          for value in binding['claimBoundary'].values():
              assert value is False

          recon = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-v1_1-source-identity-reconciliation.v1.json').read_text(encoding='utf-8'))
          assert recon['verification']['localFreezeParentBytesExactlyMatchCurrentRepositoryBlob'] is True
          assert recon['verification']['v1_2FreezeParentIdentityValidAgainstCurrentRepositoryBlob'] is True
          assert recon['disposition']['modifyHistoricalV1_1Binding'] is False
          assert recon['disposition']['v1_2FreezeInvalidatedByThisDiscrepancy'] is False
          PY
