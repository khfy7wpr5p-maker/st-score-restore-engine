name: Stage 7 governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage7-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate dependency lock
        run: python tools/validate_dependency_lock.py

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Validate Stage 6 final-exit current truth
        run: python tools/validate_stage6_final_exit_current_truth.py

      - name: Validate Stage 7 entry authorization
        run: python tools/validate_stage7_entry_authorization.py

      - name: Run Stage 7 synthetic preview release drills
        run: python tools/run_stage7_preview_release_drills.py

      - name: Validate Stage 7 final exit
        run: python tools/validate_stage7_final_exit.py

      - name: Run Stage 7 unit tests
        run: |
          python -m unittest \
            tests.test_stage7_entry_authorization \
            tests.test_preview_release \
            tests.test_stage7_final_exit -v

      - name: Compile Stage 7 sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage7_entry_authorization.py \
            src/st_score_restore/preview_release.py \
            src/st_score_restore/stage7_final_exit.py \
            tools/validate_stage7_entry_authorization.py \
            tools/run_stage7_preview_release_drills.py \
            tools/validate_stage7_final_exit.py
