name: Stage 11 V2d Restored Topology Successor V1.5.2 Contract

on:
  push:
    branches:
      - stage11-v2d-restored-topology-successor-v1_5
    paths:
      - src/st_score_restore/stage11_v2d_restored_topology_successor_v1_5_2.py
      - tests/test_stage11_v2d_restored_topology_successor_v1_5_2.py
      - .github/workflows/stage11_v2d_restored_topology_successor_v1_5_2_contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: python -m pip install -e . pytest

      - name: Run v1.5.2 contract tests and parent regression tests
        run: |
          python -m pytest -q \
            tests/test_stage11_v2d_restored_topology_successor_v1_5.py \
            tests/test_stage11_v2d_restored_topology_successor_v1_5_1.py \
            tests/test_stage11_v2d_restored_topology_successor_v1_5_2.py
