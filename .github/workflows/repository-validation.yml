name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate dependency lock
        run: python tools/validate_dependency_lock.py

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Install exact offline validation stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.validation.lock

      - name: Verify installed dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import cv2
          import numpy
          assert cv2.__version__ == "4.13.0"
          assert numpy.__version__ == "2.3.5"
          expected = {
              "attrs": "26.1.0",
              "jsonschema": "4.26.0",
              "jsonschema-specifications": "2025.9.1",
              "referencing": "0.37.0",
              "rpds-py": "2026.5.1",
          }
          for package, wanted in expected.items():
              assert version(package) == wanted, (package, version(package), wanted)
          PY

      - name: Validate repository contract
        run: python tools/validate_repository.py

      - name: Validate fixture catalog
        run: python tools/validate_fixture_catalog.py

      - name: Validate Stage 1A dataset contract
        run: python tools/validate_dataset_manifest.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q src tools tests
