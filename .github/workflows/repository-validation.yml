name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate dependency lock
        run: python tools/validate_dependency_lock.py

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Install hash-locked offline validation stack
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            -r requirements.validation.lock

      - name: Verify installed dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import cv2
          import numpy
          assert cv2.__version__ == "4.13.0"
          assert numpy.__version__ == "2.3.5"
          expected = {
              "pypdfium2": "5.13.0",
              "attrs": "26.1.0",
              "jsonschema": "4.26.0",
              "jsonschema-specifications": "2025.9.1",
              "referencing": "0.37.0",
              "rpds-py": "2026.5.1",
              "typing-extensions": "4.15.0",
          }
          for package, wanted in expected.items():
              assert version(package) == wanted, (package, version(package), wanted)
          PY

      - name: Verify dependency graph completeness
        run: python -m pip check

      - name: Validate repository contract
        run: python tools/validate_repository.py

      - name: Validate architecture consistency
        run: python tools/validate_architecture_consistency.py

      - name: Validate fixture catalog
        run: python tools/validate_fixture_catalog.py

      - name: Validate Stage 1A dataset contract
        run: python tools/validate_dataset_manifest.py

      - name: Validate Stage 1C vault verification contract
        run: python tools/validate_stage1c_vault_verification.py

      - name: Validate Stage 1C managed-standard verification contract
        run: python tools/validate_stage1c_managed_standard_verification.py

      - name: Validate Stage 1C managed-restricted verification contract
        run: python tools/validate_stage1c_managed_restricted_verification.py

      - name: Validate Stage 1C high-assurance compatibility contract
        run: python tools/validate_stage1c_high_assurance_compatibility.py

      - name: Evaluate Stage 1C artifact admission zero state
        run: python tools/evaluate_stage1c_artifact_admission.py

      - name: Require Stage 1C development artifact admission
        run: |
          python tools/evaluate_stage1c_artifact_admission.py \
            evidence/stage1c/imslp799143/admission-request.v1.json \
            --catalog evidence/stage1c/imslp799143/catalog.v1.json \
            --profile-verification evidence/stage1c/imslp799143/managed-standard-verification.v1.json \
            --require-eligible

      - name: Require Stage 1C held-out artifact admission
        run: |
          python tools/evaluate_stage1c_artifact_admission.py \
            evidence/stage1c/imslp82860/admission-request.v1.json \
            --catalog evidence/stage1c/corpus/catalog.v1.json \
            --profile-verification evidence/stage1c/imslp82860/managed-standard-verification.v1.json \
            --require-eligible

      - name: Require Stage 1C C17C exact-byte degradation reclassification
        run: |
          python tools/evaluate_stage1c_artifact_admission.py \
            evidence/stage1c/imslp82860-c17c-noise/admission-request.v2.json \
            --catalog evidence/stage1c/imslp82860-c17c-noise/catalog.v2.json \
            --profile-verification evidence/stage1c/imslp82860/managed-standard-verification.v1.json \
            --require-eligible

      - name: Require Stage 1C C17 guitar TAB combined admission
        run: |
          python tools/evaluate_stage1c_artifact_admission.py \
            evidence/stage1c/wikimedia-guitar-technical-exercise-no1/admission-request.v1.json \
            --catalog evidence/stage1c/wikimedia-guitar-technical-exercise-no1/catalog.v1.json \
            --profile-verification evidence/stage1c/imslp799143/managed-standard-verification.v1.json \
            --require-eligible

      - name: Require Stage 1C C17D phone-photo admission
        run: |
          python tools/evaluate_stage1c_artifact_admission.py \
            evidence/stage1c/nearer-my-god-to-thee-c17d/admission-request.v1.json \
            --catalog evidence/stage1c/nearer-my-god-to-thee-c17d/catalog.v1.json \
            --profile-verification evidence/stage1c/nearer-my-god-to-thee-c17d/managed-restricted-verification.v1.json \
            --require-eligible

      - name: Require Stage 1C corpus structural readiness
        run: |
          python tools/evaluate_stage1_corpus_readiness.py \
            evidence/stage1c/corpus/catalog.v1.json \
            --as-of 2026-08-25 \
            --require-ready

      - name: Require Stage 1C C15 committed snapshot freeze
        run: python tools/build_stage1_snapshot.py --check

      - name: Require Stage 1C C16 frozen coverage decision
        run: python tools/evaluate_stage1_coverage_bias.py --check --require-insufficient

      - name: Require committed Stage 1C expanded-v2 evidence
        run: python tools/build_stage1_expanded_snapshot.py --check

      - name: Validate Stage 1 final exit acceptance
        run: python tools/validate_stage1_exit_acceptance.py

      - name: Validate Stage 2 quality analysis contract
        run: python tools/validate_stage2_quality_analysis.py

      - name: Validate Stage 2 approved-custody execution contract
        run: python tools/validate_stage2_custody_execution.py

      - name: Validate Stage 2 corpus execution evidence
        run: python tools/validate_stage2_corpus_execution_evidence.py

      - name: Validate Stage 2 final exit acceptance
        run: python tools/validate_stage2_exit_acceptance.py

      - name: Validate Stage 3 multi-page PDF pipeline
        run: python tools/validate_stage3_pdf_pipeline.py

      - name: Validate Stage 3 authorized PDF execution boundary
        run: python tools/validate_stage3_custody_execution.py

      - name: Validate Stage 3 real-corpus execution runner
        run: python tools/validate_stage3_real_corpus_runner.py

      - name: Validate Stage 3 real-corpus execution evidence
        run: python tools/validate_stage3_real_corpus_execution_evidence.py

      - name: Validate Stage 3 final exit acceptance
        run: python tools/validate_stage3_exit_acceptance.py

      - name: Validate Stage 4 entry/start framework
        run: python tools/validate_stage4_entry_start.py

      - name: Validate Stage 4 safety-calibration purpose grants
        run: python tools/validate_stage4_purpose_grants.py

      - name: Validate Stage 4 reference-label evidence contract
        run: python tools/validate_stage4_reference_labels.py

      - name: Validate Stage 4 human reference-label work package
        run: python tools/validate_stage4_reference_label_work_package.py

      - name: Validate Stage 4 completed human reference labels
        run: python tools/validate_stage4_reference_label_completion.py

      - name: Validate Stage 4 accepted real reference-label bundle
        run: python tools/validate_stage4_reference_label_acceptance.py

      - name: Validate Stage 4 real development calibration execution authorization
        run: python tools/validate_stage4_execution_authorization.py

      - name: Validate Stage 4 private metric development runner contract
        run: python tools/validate_stage4_development_calibration_runner.py

      - name: Validate Stage 4 candidate derivation methodology
        run: python tools/validate_stage4_candidate_derivation.py

      - name: Validate Stage 4 public calibration evidence contract
        run: python tools/validate_stage4_calibration_evidence.py

      - name: Validate Stage 4 exit readiness
        run: python tools/validate_stage4_exit_readiness.py

      - name: Validate Stage 4 current truth checkpoint
        run: python tools/validate_stage4_current_truth.py

      - name: Validate Stage 4 post-Wikimedia current truth
        run: python tools/validate_stage4_post_wikimedia_current_truth.py

      - name: Validate Stage 4 Wikimedia human-label ingestion gate
        run: python tools/validate_stage4_wikimedia_reference_gate.py

      - name: Validate Stage 4 Wikimedia reference-bundle acceptance
        run: python tools/validate_stage4_wikimedia_reference_acceptance.py

      - name: Validate Stage 4 post-Wikimedia acceptance current truth
        run: python tools/validate_stage4_post_wikimedia_acceptance_current_truth.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q src tools tests
