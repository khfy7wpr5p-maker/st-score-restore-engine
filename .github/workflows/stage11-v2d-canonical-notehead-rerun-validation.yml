name: Stage 11 V2d Canonical Notehead Rerun Validation

on:
  pull_request:
    paths:
      - "src/st_score_restore/stage11_v2d_canonical_cpu_notehead_semantic_rerun.py"
      - "tests/test_stage11_v2d_canonical_cpu_notehead_semantic_rerun.py"
      - "notebooks/stage11_v2d_canonical_cpu_notehead_semantic_rerun.ipynb"
      - ".github/workflows/stage11-v2d-canonical-notehead-rerun-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/st_score_restore/stage11_v2d_canonical_cpu_notehead_semantic_rerun.py"
      - "tests/test_stage11_v2d_canonical_cpu_notehead_semantic_rerun.py"
      - "notebooks/stage11_v2d_canonical_cpu_notehead_semantic_rerun.ipynb"
      - ".github/workflows/stage11-v2d-canonical-notehead-rerun-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Run focused rerun tests
        run: python -m unittest tests.test_stage11_v2d_canonical_cpu_notehead_semantic_rerun -v
      - name: Compile focused runner and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2d_canonical_cpu_notehead_semantic_rerun.py \
            tests/test_stage11_v2d_canonical_cpu_notehead_semantic_rerun.py
      - name: Validate notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          path = Path('notebooks/stage11_v2d_canonical_cpu_notehead_semantic_rerun.ipynb')
          payload = json.loads(path.read_text(encoding='utf-8'))
          for cell in payload.get('cells', []):
              if cell.get('cell_type') == 'code':
                  ast.parse(''.join(cell.get('source', [])))
          print('canonical notehead rerun notebook syntax PASS')
          PY
