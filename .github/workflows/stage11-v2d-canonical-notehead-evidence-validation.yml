name: Stage 11 V2d Canonical Notehead Evidence Validation

on:
  pull_request:
    paths:
      - 'src/st_score_restore/stage11_v2d_canonical_notehead_evidence.py'
      - 'tests/test_stage11_v2d_canonical_notehead_evidence.py'
      - 'evidence/stage11/v2d/v2d-canonical-notehead-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-class-selection-decision.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-feasibility-audit.v1.json'
      - 'evidence/stage11/v2d/v2d-next-semantic-class-strategy.v1.json'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-canonical-notehead-evidence-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'src/st_score_restore/stage11_v2d_canonical_notehead_evidence.py'
      - 'tests/test_stage11_v2d_canonical_notehead_evidence.py'
      - 'evidence/stage11/v2d/v2d-canonical-notehead-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-class-selection-decision.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-feasibility-audit.v1.json'
      - 'evidence/stage11/v2d/v2d-next-semantic-class-strategy.v1.json'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-canonical-notehead-evidence-validation.yml'

jobs:
  validate:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate hash-bound class evidence
        run: python -m unittest tests.test_stage11_v2d_canonical_notehead_evidence
      - name: Compile validator and test
        run: python -m py_compile src/st_score_restore/stage11_v2d_canonical_notehead_evidence.py tests/test_stage11_v2d_canonical_notehead_evidence.py
      - name: Validate Stage 11 V2d JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('evidence/stage11/v2d').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          json.loads(Path('docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json').read_text(encoding='utf-8'))
          print('Stage 11 V2d JSON syntax PASS')
          PY
