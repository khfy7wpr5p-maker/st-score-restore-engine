name: Stage 11 V2d Restored Topology Successor V1.5.3 Contract

on:
  push:
    branches:
      - stage11-v2d-restored-topology-successor-v1_5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Run v1.5.3 restricted replacement contract
        run: pytest -q tests/test_stage11_v2d_restored_topology_successor_v1_5_3.py
