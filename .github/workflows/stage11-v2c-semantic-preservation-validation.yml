name: Stage 11 V2c Semantic Preservation Validation

on:
  pull_request:
    paths:
      - "src/st_score_restore/stage11_v2c_semantic_preservation.py"
      - "src/st_score_restore/stage11_v2c_execution_evidence.py"
      - "src/st_score_restore/stage11_v2c_full20_execution_evidence.py"
      - "src/st_score_restore/stage11_v2c_teacher_review.py"
      - "tests/test_stage11_v2c_semantic_preservation.py"
      - "tests/test_stage11_v2c_execution_evidence.py"
      - "tests/test_stage11_v2c_full20_execution_evidence.py"
      - "tests/test_stage11_v2c_teacher_review.py"
      - "tests/test_stage11_v2c_line_semantic_evidence.py"
      - "evidence/stage11/v2c/**"
      - "docs/live/ST_SCORE_RESTORE_STAGE11_V2C_CURRENT_TRUTH.json"
      - "docs/adr/0034-stage11-v2c-applicable-class-semantic-evidence.md"
      - ".github/workflows/stage11-v2c-semantic-preservation-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/st_score_restore/stage11_v2c_semantic_preservation.py"
      - "src/st_score_restore/stage11_v2c_execution_evidence.py"
      - "src/st_score_restore/stage11_v2c_full20_execution_evidence.py"
      - "src/st_score_restore/stage11_v2c_teacher_review.py"
      - "tests/test_stage11_v2c_semantic_preservation.py"
      - "tests/test_stage11_v2c_execution_evidence.py"
      - "tests/test_stage11_v2c_full20_execution_evidence.py"
      - "tests/test_stage11_v2c_teacher_review.py"
      - "tests/test_stage11_v2c_line_semantic_evidence.py"
      - "evidence/stage11/v2c/**"
      - "docs/live/ST_SCORE_RESTORE_STAGE11_V2C_CURRENT_TRUTH.json"
      - "docs/adr/0034-stage11-v2c-applicable-class-semantic-evidence.md"
      - ".github/workflows/stage11-v2c-semantic-preservation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository
        run: python -m pip install -e .
      - name: Validate Stage 11 V2c semantic evidence
        run: python -m unittest tests.test_stage11_v2c_semantic_preservation -v
      - name: Validate Stage 11 V2c Barley repeat evidence
        run: python -m unittest tests.test_stage11_v2c_execution_evidence -v
      - name: Validate Stage 11 V2c full20 repeat evidence
        run: python -m unittest tests.test_stage11_v2c_full20_execution_evidence -v
      - name: Validate Stage 11 V2c teacher review evidence
        run: python -m unittest tests.test_stage11_v2c_teacher_review -v
      - name: Validate Stage 11 V2c line semantic evidence
        run: python -m unittest tests.test_stage11_v2c_line_semantic_evidence -v
      - name: Revalidate V2a root-cause boundary
        run: python -m unittest tests.test_stage11_v2a_preservation_root_cause -v
      - name: Revalidate V2a shadow corpus boundary
        run: python -m unittest tests.test_stage11_v2a_shadow_corpus -v
      - name: Compile V2c modules and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2c_semantic_preservation.py \
            src/st_score_restore/stage11_v2c_execution_evidence.py \
            src/st_score_restore/stage11_v2c_full20_execution_evidence.py \
            src/st_score_restore/stage11_v2c_teacher_review.py \
            tests/test_stage11_v2c_semantic_preservation.py \
            tests/test_stage11_v2c_execution_evidence.py \
            tests/test_stage11_v2c_full20_execution_evidence.py \
            tests/test_stage11_v2c_teacher_review.py \
            tests/test_stage11_v2c_line_semantic_evidence.py
      - name: Validate V2c JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('evidence/stage11/v2c/v2c-corpus-plan.v1.json'),
              Path('evidence/stage11/v2c/v2c-expected-class-manifest.v1.json'),
              Path('evidence/stage11/v2c/v2c-teacher-review-overlay.v1.json'),
              Path('evidence/stage11/v2c/v2c-teacher-review-resolution.v1.json'),
              Path('evidence/stage11/v2c/v2c-barley-repeat-execution.v1.json'),
              Path('evidence/stage11/v2c/v2c-full20-repeat-execution.v1.json'),
              Path('evidence/stage11/v2c/v2c-line-semantic-evidence.v1.json'),
              Path('docs/live/ST_SCORE_RESTORE_STAGE11_V2C_CURRENT_TRUTH.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid json: {path}')
          PY
