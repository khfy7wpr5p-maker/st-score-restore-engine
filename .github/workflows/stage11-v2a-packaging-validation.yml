name: Stage 11 V2a packaging validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage11-v2a-packaging:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact binary runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            -r requirements.lock

      - name: Validate packaging notebook JSON
        run: python -m json.tool notebooks/stage11_v2a_frozen_candidate_packaging_colab.ipynb > /dev/null

      - name: Validate packaging pipeline governance
        run: python tools/validate_stage11_v2a_packaging_pipeline.py

      - name: Run packaging contract tests
        run: python -m unittest tests.test_stage11_v2a_packaging -v

      - name: Validate packaging current truth
        run: python tools/validate_stage11_v2a_packaging_current_truth.py

      - name: Run packaging current-truth tests
        run: python -m unittest tests.test_stage11_v2a_packaging_current_truth -v

      - name: Compile packaging sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2a_packaging.py \
            src/st_score_restore/stage11_v2a_packaging_current_truth.py \
            tools/stage11_v2a_candidate_packaging.py \
            tools/validate_stage11_v2a_packaging_pipeline.py \
            tools/validate_stage11_v2a_packaging_current_truth.py
