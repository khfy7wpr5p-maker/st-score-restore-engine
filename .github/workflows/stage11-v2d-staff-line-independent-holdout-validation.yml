name: Stage 11 V2d Staff-Line Independent Holdout Freeze Validation

on:
  pull_request:
    paths:
      - 'evidence/stage11/v2d/v2d-staff-line-fresh-holdout-authorization.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze-plan.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-teacher-work-package.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-qualification-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_STAFF_LINE_HOLDOUT_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-staff-line-independent-holdout-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'evidence/stage11/v2d/v2d-staff-line-fresh-holdout-authorization.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze-plan.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-teacher-work-package.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-independent-holdout-qualification-result-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_STAFF_LINE_HOLDOUT_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-staff-line-independent-holdout-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate authorization and immutable policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          auth = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-fresh-holdout-authorization.v1.json').read_text())
          policy = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json').read_text())
          assert auth['status'] == 'AUTHORIZED_FOR_ONE_FRESH_INDEPENDENT_HOLDOUT_QUALIFICATION'
          assert auth['authorizedActions']['runFrozenV1_2SourceOnlyDetectorWithoutRetuning'] is True
          assert auth['stillForbidden']['detectorRetuningAfterHoldoutAccess'] is True
          assert auth['stillForbidden']['restoredOutputStaffTopologyComparison'] is True
          assert auth['stillForbidden']['pullRequestMerge'] is True
          assert policy['status'] == 'FROZEN_PRE_HOLDOUT'
          assert policy['freezeBoundary']['thresholdMovementAfterFreshHoldoutAccessAllowed'] is False
          req = policy['futureIndependentHoldoutQualification']['requirements']
          assert req['teacherSystemRecallAtHalfSpacingMin'] == 0.65
          assert req['predictedSystemPrecisionAtHalfSpacingMin'] == 0.80
          assert req['presentPageCoverageMin'] == 0.95
          assert req['absentPageSpecificityMin'] == 1.0
          PY
      - name: Validate source freeze identity and determinism
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze-plan.v1.json').read_text())
          freeze = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze.v1.json').read_text())
          assert plan['status'] == 'FROZEN_BEFORE_HOLDOUT_DETECTOR_EXECUTION'
          assert plan['holdoutSource']['datasetItemId'] == 'dataset.item.imslp82860-chopin-op69.v2'
          assert plan['holdoutSource']['useAllPdfPages'] is True
          assert plan['holdoutSource']['pageSelectionOrCherryPickingAllowed'] is False
          assert plan['detectorExecution']['retuningAllowed'] is False
          assert freeze['status'] == 'SOURCE_ONLY_RAW_FROZEN_TEACHER_TRUTH_PENDING'
          assert freeze['holdoutSource']['pdfPageCount'] == 8
          assert freeze['holdoutSource']['allPagesUsed'] is True
          assert freeze['holdoutSource']['pageCherryPickingPerformed'] is False
          assert freeze['rawFreeze']['pageCount'] == 8
          assert freeze['rawFreeze']['sourceIdentityMatchedPages'] == 8
          assert freeze['rawFreeze']['sourceIdentityMatchRate'] == 1.0
          assert freeze['rawFreeze']['predictedSystemCount'] == 128
          assert freeze['rawFreeze']['perPagePredictedSystemCounts'] == [5,13,18,18,23,17,18,16]
          assert freeze['rawFreeze']['rawArtifactSha256'] == 'f2ef8a352d9c1f26e7c460ed0f71b125a33e35838294f741d562ce81d4b077fb'
          assert freeze['rawFreeze']['byteRepeatDeterminismVerified'] is True
          assert freeze['rawFreeze']['repeatArtifactSha256'] == freeze['rawFreeze']['rawArtifactSha256']
          assert freeze['detector']['retunedAfterHoldoutAccess'] is False
          assert freeze['detector']['teacherCoordinatesUsedDuringInference'] is False
          assert freeze['detector']['restoredOutputsUsedDuringInference'] is False
          assert freeze['qualification']['scoringExecuted'] is False
          assert freeze['qualification']['detectorQualified'] is False
          PY
      - name: Validate blind teacher package contains no detector leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/stage11/v2d/v2d-staff-line-independent-holdout-teacher-work-package.v1.json')
          data = json.loads(p.read_text())
          text = p.read_text().lower()
          assert data['status'] == 'READY_FOR_BLIND_HUMAN_ANNOTATION'
          assert data['independentHoldout'] is True
          assert data['teacherAnnotationIndependent'] is True
          assert data['detectorOutputsShownToTeacher'] is False
          assert data['detectorPredictedCountsShownToTeacher'] is False
          assert data['lineDetectorGeometryShownToTeacher'] is False
          assert data['restoredOutputsShownToTeacher'] is False
          assert len(data['pages']) == 8
          assert all(page['completed'] is False for page in data['pages'])
          assert all(page['staffPresent'] is None for page in data['pages'])
          assert all(page['systems'] is None for page in data['pages'])
          assert all(page['sourceFileName'] == f"chopin-op69-holdout-p{i}.png" for i, page in enumerate(data['pages'], 1))
          for forbidden in ('predictedsystemcount', 'perpagepredictedsystemcounts', 'f2ef8a352d9c1f26e7c460ed0f71b125a33e35838294f741d562ce81d4b077fb'):
              assert forbidden not in text
          PY
      - name: Validate completed holdout qualification and stop gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          truth = json.loads(Path('docs/live/ST_SCORE_RESTORE_STAGE11_V2D_STAFF_LINE_HOLDOUT_CURRENT_TRUTH.json').read_text())
          freeze = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-independent-holdout-source-freeze.v1.json').read_text())
          result = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-independent-holdout-qualification-result-binding.v1.json').read_text())
          policy = json.loads(Path('evidence/stage11/v2d/v2d-staff-line-source-detector-qualification-policy.v1.json').read_text())

          assert truth['state'] == 'INDEPENDENT_HOLDOUT_QUALIFICATION_COMPLETE_REJECTED_CURRENT_DETECTOR'
          assert truth['authorization']['freshIndependentHoldoutAuthorized'] is False
          assert truth['authorization']['restoredOutputStaffTopologyComparisonAuthorized'] is False
          assert truth['sourceOnlyRawFreeze']['rawArtifactSha256'] == freeze['rawFreeze']['rawArtifactSha256']
          assert truth['sourceOnlyRawFreeze']['byteRepeatDeterminismVerified'] is True
          assert truth['blindTeacherReview']['status'] == 'COMPLETE_AND_FROZEN'
          assert truth['blindTeacherReview']['completedPageCount'] == 8
          assert truth['blindTeacherReview']['teacherConfirmedSystemCount'] == 88
          assert truth['qualification']['scoringExecuted'] is True
          assert truth['qualification']['scoreExactlyOnceAgainstFrozenRaw'] is True
          assert truth['qualification']['scorerCompatibilityReproducedFrozenV1MatchedCount71'] is True
          assert truth['qualification']['teacherSystemCount'] == 88
          assert truth['qualification']['predictedSystemCount'] == 128
          assert truth['qualification']['matchedSystemCountAtHalfSpacing'] == 80
          assert truth['qualification']['teacherSystemRecallAtHalfSpacing'] == 80 / 88
          assert truth['qualification']['predictedSystemPrecisionAtHalfSpacing'] == 80 / 128
          assert truth['qualification']['presentPageCoverage'] == 1.0
          assert truth['qualification']['absentPageSpecificity'] == 0.0
          assert truth['qualification']['failedCriteria'] == ['predictedSystemPrecisionAtHalfSpacing', 'absentPageSpecificity']
          assert truth['qualification']['detectorQualified'] is False
          assert truth['qualification']['sourceDetectorAdequacyEstablished'] is False
          assert truth['qualification']['staffLineDisposition'] == 'REJECTED_CURRENT_DETECTOR'
          assert truth['qualification']['noRetuningAgainstConsumedHoldout'] is True

          assert result['status'] == 'QUALIFICATION_COMPLETE_REJECTED_CURRENT_DETECTOR'
          assert result['scorer']['anchorCompatibilityPassed'] is True
          assert result['scorer']['reproducedMatchedSystemCount'] == 71
          assert result['scorer']['reproducedTeacherSystemCount'] == 197
          assert result['teacherTruthFreeze']['completedPageCount'] == 8
          assert result['teacherTruthFreeze']['confirmedSystemCount'] == 88
          assert result['holdoutScoring']['matchedSystemCountAtHalfSpacing'] == 80
          assert result['holdoutScoring']['teacherSystemRecallAtHalfSpacing'] == 80 / 88
          assert result['holdoutScoring']['predictedSystemPrecisionAtHalfSpacing'] == 80 / 128
          assert result['holdoutScoring']['absentPageSpecificity']['rate'] == 0.0
          assert result['criteriaPassed']['teacherSystemRecallAtHalfSpacing'] is True
          assert result['criteriaPassed']['predictedSystemPrecisionAtHalfSpacing'] is False
          assert result['criteriaPassed']['absentPageSpecificity'] is False
          assert result['decision']['detectorQualified'] is False
          assert result['decision']['noRetuningAgainstConsumedHoldout'] is True

          req = policy['futureIndependentHoldoutQualification']['requirements']
          assert result['holdoutScoring']['teacherSystemRecallAtHalfSpacing'] >= req['teacherSystemRecallAtHalfSpacingMin']
          assert result['holdoutScoring']['predictedSystemPrecisionAtHalfSpacing'] < req['predictedSystemPrecisionAtHalfSpacingMin']
          assert result['holdoutScoring']['absentPageSpecificity']['rate'] < req['absentPageSpecificityMin']

          for key in ('staffLinePass','semanticPreservationEstablished','overallStage11PassAuthorized','restoredImageTopologyComparisonAuthorized','productionReady','productionPromotionAuthorized','stage12EntryAuthorized','prReadyForMerge'):
              assert truth['claimBoundary'][key] is False
          PY
