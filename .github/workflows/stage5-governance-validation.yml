name: Stage 5 governance validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-stage5-governance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Stage 5 entry governance authorization
        run: python tools/validate_stage5_entry_authorization.py

      - name: Validate Stage 5 post-entry current truth
        run: python tools/validate_stage5_post_entry_authorization_current_truth.py

      - name: Validate Stage 5 framework/start authorization
        run: python tools/validate_stage5_start_authorization.py

      - name: Run Stage 5 governance unit tests
        run: |
          python -m unittest \
            tests.test_stage5_entry_authorization \
            tests.test_stage5_post_entry_authorization_current_truth \
            tests.test_stage5_start_authorization -v

      - name: Compile Stage 5 governance sources
        run: |
          python -m py_compile \
            src/st_score_restore/stage5_entry_authorization.py \
            src/st_score_restore/stage5_entry_current_truth.py \
            src/st_score_restore/stage5_start_authorization.py \
            tools/validate_stage5_entry_authorization.py \
            tools/validate_stage5_post_entry_authorization_current_truth.py \
            tools/validate_stage5_start_authorization.py
