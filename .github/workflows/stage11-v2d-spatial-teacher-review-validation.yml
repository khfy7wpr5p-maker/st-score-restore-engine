name: Stage 11 V2d Spatial Teacher Review Validation

on:
  pull_request:
    paths:
      - 'src/st_score_restore/stage11_v2d_spatial_teacher_review.py'
      - 'src/st_score_restore/stage11_v2d_clef_teacher_completion.py'
      - 'src/st_score_restore/stage11_v2d_clef_source_qualification.py'
      - 'src/st_score_restore/stage11_v2d_clef_source_qualification_colab.py'
      - 'tests/test_stage11_v2d_spatial_teacher_review.py'
      - 'tests/test_stage11_v2d_clef_teacher_completion.py'
      - 'tests/test_stage11_v2d_clef_source_qualification.py'
      - 'tests/test_stage11_v2d_clef_source_qualification_colab.py'
      - 'notebooks/stage11_v2d_clef_source_qualification_colab.ipynb'
      - 'evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-teacher-taxonomy-amendment.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-box-teacher-completion-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-source-qualification-contract.v1.json'
      - 'docs/stage11-v2d-spatial-teacher-review-guide.md'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-spatial-teacher-review-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'src/st_score_restore/stage11_v2d_spatial_teacher_review.py'
      - 'src/st_score_restore/stage11_v2d_clef_teacher_completion.py'
      - 'src/st_score_restore/stage11_v2d_clef_source_qualification.py'
      - 'src/st_score_restore/stage11_v2d_clef_source_qualification_colab.py'
      - 'tests/test_stage11_v2d_spatial_teacher_review.py'
      - 'tests/test_stage11_v2d_clef_teacher_completion.py'
      - 'tests/test_stage11_v2d_clef_source_qualification.py'
      - 'tests/test_stage11_v2d_clef_source_qualification_colab.py'
      - 'notebooks/stage11_v2d_clef_source_qualification_colab.ipynb'
      - 'evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-teacher-taxonomy-amendment.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-box-teacher-completion-binding.v1.json'
      - 'evidence/stage11/v2d/v2d-clef-source-qualification-contract.v1.json'
      - 'docs/stage11-v2d-spatial-teacher-review-guide.md'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-spatial-teacher-review-validation.yml'

jobs:
  validate:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate pristine spatial review package
        run: python -m unittest tests.test_stage11_v2d_spatial_teacher_review -v
      - name: Validate clef teacher completion contract
        run: python -m unittest tests.test_stage11_v2d_clef_teacher_completion -v
      - name: Validate P4 clef source qualification contract
        run: python -m unittest tests.test_stage11_v2d_clef_source_qualification -v
      - name: Validate P4 source-only Colab runner
        run: python -m unittest tests.test_stage11_v2d_clef_source_qualification_colab -v
      - name: Compile validators, runner, and tests
        run: |
          python -m py_compile \
            src/st_score_restore/stage11_v2d_spatial_teacher_review.py \
            src/st_score_restore/stage11_v2d_clef_teacher_completion.py \
            src/st_score_restore/stage11_v2d_clef_source_qualification.py \
            src/st_score_restore/stage11_v2d_clef_source_qualification_colab.py \
            tests/test_stage11_v2d_spatial_teacher_review.py \
            tests/test_stage11_v2d_clef_teacher_completion.py \
            tests/test_stage11_v2d_clef_source_qualification.py \
            tests/test_stage11_v2d_clef_source_qualification_colab.py
      - name: Validate Stage 11 V2d spatial JSON syntax
        run: |
          python -m json.tool evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json >/dev/null
          python -m json.tool evidence/stage11/v2d/v2d-clef-teacher-taxonomy-amendment.v1.json >/dev/null
          python -m json.tool evidence/stage11/v2d/v2d-clef-box-teacher-completion-binding.v1.json >/dev/null
          python -m json.tool evidence/stage11/v2d/v2d-clef-source-qualification-contract.v1.json >/dev/null
      - name: Validate P4 notebook JSON and Python cells
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          path = Path('notebooks/stage11_v2d_clef_source_qualification_colab.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          assert notebook.get('nbformat') == 4
          for index, cell in enumerate(notebook.get('cells', [])):
              if cell.get('cell_type') != 'code':
                  continue
              source = ''.join(cell.get('source', []))
              if source.lstrip().startswith(('!', '%')):
                  continue
              ast.parse(source, filename=f'{path}:cell{index}')
          print('P4 notebook static validation PASS')
          PY
