name: Stage 11 V2d Spatial Teacher Review Validation

on:
  pull_request:
    paths:
      - 'src/st_score_restore/stage11_v2d_spatial_teacher_review.py'
      - 'tests/test_stage11_v2d_spatial_teacher_review.py'
      - 'evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json'
      - 'docs/stage11-v2d-spatial-teacher-review-guide.md'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-spatial-teacher-review-validation.yml'
  push:
    branches:
      - stage11-v2c-semantic-detector-corpus-expansion
    paths:
      - 'src/st_score_restore/stage11_v2d_spatial_teacher_review.py'
      - 'tests/test_stage11_v2d_spatial_teacher_review.py'
      - 'evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json'
      - 'docs/stage11-v2d-spatial-teacher-review-guide.md'
      - 'docs/live/ST_SCORE_RESTORE_STAGE11_V2D_CURRENT_TRUTH.json'
      - '.github/workflows/stage11-v2d-spatial-teacher-review-validation.yml'

jobs:
  validate:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate pristine spatial review package
        run: python -m unittest tests.test_stage11_v2d_spatial_teacher_review -v
      - name: Compile validator and tests
        run: python -m py_compile src/st_score_restore/stage11_v2d_spatial_teacher_review.py tests/test_stage11_v2d_spatial_teacher_review.py
      - name: Validate work-package JSON syntax
        run: python -m json.tool evidence/stage11/v2d/v2d-spatial-teacher-review-work-package.v1.json >/dev/null

